[package]
name = "abu-wallettool"
version = "0.1.2"
edition = "2024"
description = "Alpha Bank Union (ABU) Wallet Tool for Alpha Coin"
license = "MIT"
authors = ["Max Shin"]

[dependencies]
# 密码学
sequoia-openpgp = { version = "2.2.0", default-features = false, features = ["crypto-cng"] }
ring = "0.17"
sha3 = "0.10"
base64 = "0.22.1"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
sha2 = "0.10"

# 数据库
rusqlite = { version = "0.38.0", features = ["bundled"] }

# ZIP 处理
zip = "8.1.0"

# 用户界面
dialoguer = "0.12.0"
console = "0.16.2"
native-dialog = "0.7.0"

# 配置
simple-home-dir = "0.5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 工具
chrono = "0.4"
anyhow = "1.0"
thiserror = "2.0.18"